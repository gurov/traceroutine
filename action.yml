name: 'traceroutine check'
description: 'Check LLM agent traces against a declared process and cost thresholds'
author: 'Pavel Gurov'
branding: {icon: 'git-branch', color: 'red'}

inputs:
  traces:
    description: 'File or directory of traces (OTLP JSON, Claude Code transcripts, chat transcripts)'
    required: true
  process:
    description: 'process.yaml — how the agent is supposed to work'
    required: false
    default: 'process.yaml'
  adapter:
    description: 'Trace format; detected automatically by default'
    required: false
    default: ''
  case:
    description: 'Case notion: trace | session | task | attr:<name>'
    required: false
    default: 'trace'
  map:
    description: 'activity_map.yaml — the activity vocabulary, the same one the reports use'
    required: false
    default: ''
  baseline:
    description: 'The "before" events.parquet — enables growth thresholds on cost and fitness drop'
    required: false
    default: ''
  warn-only:
    description: 'Do not fail the build on violations — for taming thresholds'
    required: false
    default: 'false'
  install:
    description: 'What to install: a package name, a version specifier, or git+https://…'
    required: false
    default: 'traceroutine'

outputs:
  status:          {description: 'ok | failed',                              value: '${{ steps.check.outputs.status }}'}
  fitness:         {description: 'Conformance to the declared flow, 0…1',    value: '${{ steps.check.outputs.fitness }}'}
  conforming:      {description: 'Share of runs with no deviation',          value: '${{ steps.check.outputs.conforming }}'}
  usd-per-case:    {description: 'Cost of a single run, $',                  value: '${{ steps.check.outputs.usd-per-case }}'}
  off-model-share: {description: 'Share of budget spent off-model',          value: '${{ steps.check.outputs.off-model-share }}'}
  failures:        {description: 'How many thresholds were violated',        value: '${{ steps.check.outputs.failures }}'}

# Значения входов НИГДЕ не подставляются прямо в текст `run:` — только через env.
# Иначе трейсы или имя файла, пришедшие из PR, попадают в командную строку раннера:
# это классическая инъекция в GitHub Actions, и проверка, которую можно обойти,
# хуже отсутствующей.
runs:
  using: composite
  steps:
    # pipx предустановлен на раннерах GitHub — экшену не нужен ни setup-python,
    # ни сторонние экшены, ни кеш. Чем меньше движущихся частей у проверки, тем
    # меньше поводов её отключить.
    - shell: bash
      env: {INSTALL: '${{ inputs.install }}'}
      run: |
        pipx install "$INSTALL"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - shell: bash
      env:
        TRACES: '${{ inputs.traces }}'
        CASE: '${{ inputs.case }}'
        ADAPTER: '${{ inputs.adapter }}'
      run: |
        traceroutine ingest "$TRACES" -o events.parquet \
          --case "$CASE" ${ADAPTER:+--adapter "$ADAPTER"}

    - id: check
      shell: bash
      env:
        PROCESS: '${{ inputs.process }}'
        MAP: '${{ inputs.map }}'
        BASELINE: '${{ inputs.baseline }}'
        WARN_ONLY: '${{ inputs.warn-only }}'
      run: |
        traceroutine check events.parquet -p "$PROCESS" \
          ${MAP:+-m "$MAP"} \
          ${BASELINE:+--baseline "$BASELINE"} \
          $([ "$WARN_ONLY" = "true" ] && echo --warn-only)
