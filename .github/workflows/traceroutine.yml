# Пример: проверка агента на каждом PR.
#
# Смысл не в том, чтобы измерить стоимость (это покажет любой дашборд), а в том,
# чтобы поймать РЕГРЕССИЮ ПОВЕДЕНИЯ до мержа: агент стал ходить другим путём,
# перестал проверять себя, начал зацикливаться. Смена модели и правка промпта
# ломают именно это, а юнит-тесты такого не видят.
name: traceroutine

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Здесь — ваш шаг, который прогоняет агента на эталонном наборе задач
      # и складывает трейсы в ./traces. Без него проверять нечего.
      - name: Прогнать агента
        run: ./scripts/run-agent-suite.sh --out traces/

      - id: traceroutine
        uses: ./                      # в своём репозитории: user/traceroutine@v1
        with:
          traces: traces/
          process: process.yaml
          case: session
          # Базовый лог с main: включает пороги «не хуже, чем было».
          # Его удобно хранить артефактом последней сборки main.
          # baseline: baseline/events.parquet

      # Саммари с графом отклонений экшен уже написал в job summary сам.
      - if: always()
        run: echo "fitness=${{ steps.traceroutine.outputs.fitness }} · ${{ steps.traceroutine.outputs.usd-per-case }}/прогон"
