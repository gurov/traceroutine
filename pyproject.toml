[project]
name = "agentmine"
version = "0.1.0"
description = "Process mining for LLM agent traces: find out where the tokens and the time actually go"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
# TODO перед публикацией: подставить настоящее имя.
authors = [{name = "Pavel", email = "lucius.gu@gmail.com"}]
keywords = [
    "process-mining", "llm", "agents", "observability", "opentelemetry",
    "conformance-checking", "tracing", "llmops", "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Anthropic-бэкенд слоя Abstract. Не в основных зависимостях: локальный (Ollama)
# и чисто детерминированный пути работают без него, а лишний вес ломает `uvx`.
anthropic = ["anthropic>=0.40"]

# TODO перед публикацией: заменить OWNER на свой github-аккаунт.
[project.urls]
Homepage = "https://github.com/OWNER/agentmine"
Repository = "https://github.com/OWNER/agentmine"
Issues = "https://github.com/OWNER/agentmine/issues"

[project.scripts]
agentmine = "agentmine.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmine"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "action.yml"]
