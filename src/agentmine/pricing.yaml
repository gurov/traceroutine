# Таблица цен: $ за 1M токенов. Это ПОЛЬЗОВАТЕЛЬСКИЕ данные, а не константы кода —
# цены меняются, и пересчёт старых логов по новым ценам должен работать.
# Переопределить: agentmine report --pricing my-prices.yaml
#
# Множители к ставке input:
#   cache_read     — чтение из кеша, у Anthropic 0.1×
#   cache_write_5m — запись в кеш с TTL 5 минут, 1.25×
#   cache_write_1h — то же с TTL 1 час, 2×
# Запись в кеш ДОРОЖЕ обычного input. Игнорировать её нельзя: на длинных агентных
# сессиях с растущим контекстом это заметная доля счёта.
defaults:
  cache_read: 0.1
  cache_write_5m: 1.25
  cache_write_1h: 2.0

models:
  claude-opus-5:      {input: 5.00,  output: 25.00}
  claude-opus-4-8:    {input: 5.00,  output: 25.00}
  claude-opus-4-7:    {input: 5.00,  output: 25.00}
  claude-opus-4-6:    {input: 5.00,  output: 25.00}
  claude-fable-5:     {input: 10.00, output: 50.00}
  claude-sonnet-5:    {input: 2.00,  output: 10.00}
  claude-sonnet-4-6:  {input: 3.00,  output: 15.00}
  claude-haiku-4-5:   {input: 1.00,  output: 5.00}
