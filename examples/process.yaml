# Как агент ДОЛЖЕН работать. Пишется руками, версионируется рядом с кодом агента.
#
# Зачем это вообще. Без объявленного ожидания находки process mining вырождаются
# в описание нормы: «агент часто вызывает retrieve» — верно и бесполезно. Модель
# процесса и есть то ожидание, относительно которого «часто» становится «слишком
# часто». На открытых агентах это единственный источник смысла.
#
# Имена активностей должны совпадать с тем, что в логе ПОСЛЕ словаря
# (`agentmine abstract`). Несовпадение — самая частая ошибка, `check` о ней ругается.

name: support-agent
case: trace          # лог должен быть собран с `--case trace`

# Императивная часть: happy path. Даёт fitness — одно число «насколько далеко от
# дизайна». Операторы: `->` последовательность, `|` выбор, `( )` группировка,
# `*` ноль-и-больше, `+` один-и-больше, `?` необязательный шаг.
# `any` — джокер: любая активность.
flow: |
  plan -> (generate | retrieve | fetch_ticket | remember)* -> generate -> verify -> respond

# Декларативная часть: отдельные обещания. Для агентов важнее императивной —
# агент недетерминирован по устройству, и ожидание от него формулируется не как
# «ровно такая последовательность», а как «что бы ты ни делал, не отвечай без проверки».
rules:
  - first: plan
  - last: respond
  - always: respond
  - {after: generate, expect: verify}       # не отвечать, не проверив
  - {after: respond, forbid: retrieve}      # после ответа работа закончена
  - {max: 6, of: retrieve}                  # больше шести поисков — агент заблудился
  - {never: notify, warn: true}             # эскалация к человеку: не ошибка, но следим

thresholds:
  fitness_min: 0.95
  usd_per_case_max: 0.03
  steps_p95_max: 12
  off_model_share_max: 0.05
  # Применяются только с `--baseline`: абсолютные пороги приходится подкручивать
  # после каждого релиза, «не хуже, чем было» живёт само.
  usd_per_case_increase_max: 0.15
  fitness_drop_max: 0.05
