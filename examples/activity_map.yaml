# Curated activity vocabulary for the demo dataset.
#
# In your own project this file is generated by `traceroutine abstract` and then
# committed: it is a versioned project artifact, and `overrides` is where human
# judgement lives. It is shipped here so the quickstart works without an API key —
# the rules layer alone (`--backend none`) leaves 21 raw labels, which is enough
# for a cost report but too granular for a readable process graph.
version: 1
generated: ''
backend: curated
coverage: {raw_labels: 25, canonical_labels: 21, activities: 8, recovered_by_rules: 4}
overrides:
  # A model call is one activity; which model was used is a *resource*,
  # and the report breaks cost down by it separately.
  chat: generate
mapping:
  tool:bm25_lookup: retrieve
  tool:check_citations: verify
  tool:decompose_task: plan
  tool:emit_final: respond
  tool:escalate: notify
  tool:fetch_url: retrieve
  tool:format_response: respond
  tool:get_ticket: fetch_ticket
  tool:load_context: remember
  tool:memory_read: remember
  tool:memory_write: remember
  tool:pick_tool: plan
  tool:plan_steps: plan
  tool:read_document: retrieve
  tool:rerank: retrieve
  tool:search: retrieve
  tool:self_critique: verify
  tool:validate_answer: verify
  tool:vector_search: retrieve
  tool:write_answer: respond
