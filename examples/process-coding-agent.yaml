# Процесс кодового агента. Второй пример намеренно: он показывает случай, ради
# которого слой и делался, — открытого агента, у которого happy path нет.
#
# На корпусе из 442 реальных задач Claude Code: вариантный анализ здесь мёртв
# (повторяющихся путей 32% при медиане 15 шагов и p95 = 106), то есть все находки
# без объявленного ожидания вырождаются в описание нормы. Объявленный процесс —
# единственный способ получить утверждение вместо описания.
#
# Имена активностей — канонические (`agentmine abstract` снимает аргументы вызова
# и суффикс модели: `chat:claude-opus-5` → `chat`).

name: coding-agent
case: task            # один запрос пользователя со всей работой по нему

# Императивная часть здесь СЛАБАЯ, и это ожидаемо: агент недетерминирован, жёсткая
# последовательность дала бы fitness около нуля и никакой информации. Осмысленно
# объявлять только края и грубый порядок фаз.
flow: |
  chat -> (tool:Read | tool:Grep | tool:Glob)+ -> (chat | tool:Edit | tool:Write | tool:Bash)* -> chat

# Декларативная часть — вот где сигнал. Это инженерные обещания, которые можно
# нарушить незаметно, и которых не видит ни один юнит-тест.
rules:
  - last: chat                                  # не обрываться на вызове инструмента
  - {before: tool:Edit, expect: tool:Read}      # не править файл, не прочитав его
  - {after: tool:Edit, expect: tool:Bash}       # после правки — прогнать проверку
  - {max: 40, of: tool:Bash}                    # больше сорока команд: агент заблудился
  - {after: tool:Write, forbid: tool:Write}     # два файла подряд без единой проверки

thresholds:
  fitness_min: 0.95
  usd_per_case_max: 2.00
  steps_p95_max: 60
  off_model_share_max: 0.05
